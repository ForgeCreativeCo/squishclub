name: Android app

# Builds the Fire tablet / Android APK. The app just wraps the live Netlify
# site, so it only needs rebuilding when the wrapper itself changes.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Signing secrets aren't set. Refusing to publish a release signed with a throwaway key. See README → Fire tablets & Amazon Kids → signing key."
              exit 1
            fi
            echo "::warning::Signing secrets not set; signing with a throwaway debug key. Don't install this build on a kid's tablet."
            exit 0
          fi
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty (check the name)."; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing or empty (check the name)."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 isn't valid base64. It was probably pasted incompletely."; exit 1; }
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias squish > "$RUNNER_TEMP/key.txt" 2>&1 \
            || { echo "::error::Couldn't open the signing key. Either the password doesn't match, or ANDROID_KEYSTORE_BASE64 was pasted incompletely."; exit 1; }
          echo "Signing with release key, SHA-256 fingerprint:"
          grep "SHA256:" "$RUNNER_TEMP/key.txt"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SquishTradeClub.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SquishTradeClub-apk
          path: SquishTradeClub.apk

      # Builds from main become a GitHub Release, so a tablet can download the
      # newest one straight from:
      # https://github.com/ForgeCreativeCo/squishclub/releases/latest/download/SquishTradeClub.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v1.0.${{ github.run_number }}" SquishTradeClub.apk \
            --title "Android app 1.0.${{ github.run_number }}" \
            --notes "Fire tablet / Android build of Squish Trade Club. Install SquishTradeClub.apk on the tablet." \
            --target "${{ github.sha }}" --latest
